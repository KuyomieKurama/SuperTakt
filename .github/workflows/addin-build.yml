name: Add-in-Bau

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addin-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Outlook-Aufgabenbereich bauen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Quelltext holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node bereitstellen
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: pnpm und Abhängigkeiten bereitstellen
        shell: bash
        run: |
          manager="$(node -p "require('./package.json').packageManager")"
          npm install --global "$manager"
          pnpm install --frozen-lockfile
      - name: Outlook-Aufgabenbereich bauen
        run: pnpm --filter @takt/outlook-addin build
      - name: Add-in-Aufrufe gegen den Dienst prüfen
        run: pnpm --filter @takt/local-api proof:callers
