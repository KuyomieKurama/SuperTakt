name: One-shot PR 15 consistency fix

on:
  push:
    branches:
      - 'feat/outlook-followup-attachments'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Quelltext holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/outlook-followup-attachments
          fetch-depth: 0
      - name: Konsistenzpatch anwenden
        run: python .github/one-shot-pr15.py
      - name: Änderungen einchecken und Hilfsdateien entfernen
        shell: bash
        run: |
          git rm .github/one-shot-pr15.py .github/workflows/one-shot-fix-pr15.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/local-api/openapi/takt-local-api.yaml apps/local-api/scripts/service-scenario.mjs apps/outlook-addin/scripts/proof-addin.mjs
          git commit -m "fix: document and prove add-in follow-up attachments"
          git push origin HEAD:feat/outlook-followup-attachments
