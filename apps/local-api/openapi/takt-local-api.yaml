  /pools/{poolId}/todos:
    parameters:
      - { $ref: '#/components/parameters/PoolId' }
      - { $ref: '#/components/parameters/Cursor' }
      - { $ref: '#/components/parameters/Limit' }
      - name: includeCompleted
        in: query
        description: |
          Ohne Angabe bleiben erledigte Todos außen vor. Der Pool zeigt, was zu
          tun ist (A-3.4).
        schema: { type: boolean, default: false }
    get:
      tags: [Pools]
      operationId: listPoolTodos
      summary: Todos eines Pools
      description: |
        Bei jedem Aufruf aus den Tags abgeleitet (A-3.4). Es gibt keine
        gespeicherte Zuordnung, die veralten könnte.
      responses:
        '200':
          description: Mitglieder des Pools.
          content:
