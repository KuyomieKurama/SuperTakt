  /tag-folders/{folderId}/move:
    parameters: [{ $ref: '#/components/parameters/FolderId' }]
    post:
      tags: [Tags]
      operationId: moveTagFolder
      summary: Tag-Ordner unter einen anderen Ordner hängen (A-4.6)
      description: |
        Eigene Route statt eines `parentId`-Feldes in `PATCH`, weil hier eine
        fachliche Prüfung hängt und der Fehlerfall ein eigener ist: Ein Ordner
        darf weder sich selbst noch einen seiner Nachfahren als übergeordneten
        Ordner bekommen. Der Versuch endet mit `409` und dem Code
        `tag_folder_cycle`.

        Die Prüfung läuft in derselben Transaktion wie das Verschieben. Sie
        folgt der Vorfahrenkette des Ziels mit einem Indexzugriff je Ebene und
        liest nie die gesamte Tabelle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newParentId]
              properties:
                newParentId:
                  oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
                  description: '`null` hebt den Ordner auf die Wurzelebene.'
      responses:
        '200':
          description: Verschoben.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TagFolder' }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Zyklus (`tag_folder_cycle`) oder Namenskonflikt im Zielordner
            (`name_conflict`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                zyklus:
                  value:
                    error:
                      code: tag_folder_cycle
                      message: Ein Ordner kann nicht unter einen seiner eigenen Unterordner verschoben werden.

        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  # ---------------------------------------------------------------------------
  /pools:
    get:
      tags: [Pools]
      operationId: listPools
      summary: Regeln listen — Pools, Spalten oder beides
      description: |
        Seit E-054 ist eine Kanban-Spalte dieselbe Entität wie ein Pool: ein
        Name und eine Regel über Tags. `placement` sagt, wo eine Regel
        erscheint, und dieser Filter sagt, wonach gefragt ist.

        **Ohne `placement` ist die Antwort die Pool-Liste** — also das, was
        diese Route vor E-054 lieferte. Eine Regel, die ausdrücklich nur auf dem
        Board stehen soll, taucht hier nicht auf.
      parameters:
        - name: placement
          in: query
          description: |
            `pool` (Vorgabe) — was in der Pool-Liste steht, also `placement`
            `pool` oder `both`. `board` — die Spalten des Kanban-Boards.
            `all` — jede Regel, ungeachtet der Fläche.
          schema: { type: string, enum: [pool, board, all], default: pool }
      responses:
        '200':
          description: Die Regeln der gewählten Fläche, nach Position.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Pool' } }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
    post:
      tags: [Pools]
      operationId: createPool
      summary: Pool anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PoolCreate' }
      responses:
        '201':
          description: Angelegt.
          headers:
            Location:
              schema: { type: string }
              description: Adresse des neuen Pools.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Pool' }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /pools/{poolId}:
    parameters: [{ $ref: '#/components/parameters/PoolId' }]
    patch:
