        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  /board:
    get:
      tags: [Kanban]
      operationId: getBoard
      summary: Das Kanban-Board lesen
      description: |
        Das ganze Board in **einem** Aufruf: die Spalten in ihrer Reihenfolge,
        je Spalte die erste Seite ihrer Karten, und die Karten, die in mehr als
        einer Spalte stehen.

        **Eine Spalte ist eine Regel über Tags** (E-054), also ein `Pool` mit
        `placement` `board` oder `both`. Eingerichtet wird sie deshalb über
        `POST /pools` und `PATCH /pools/{poolId}`; hier wird nur gelesen. Es
        gibt keine Route, die eine Karte in eine Spalte legt: Ziehen ist mit
        E-054 entfallen, weil sich eine Regel nicht durch Verschieben umkehren
        lässt, ohne Tags zu setzen.

        **`columns: []` heißt „keine Spalte eingerichtet"**, nicht „nichts zu
        tun". Nach der Umstellung ist das der Ausgangszustand — Migration 0009
        macht aus keinem vorhandenen Pool eine Spalte, weil sie das nicht raten
        kann.

        **Eine Karte kann in mehreren Spalten stehen.** Bei Status war das
        ausgeschlossen, bei Regeln ist es unvermeidlich: Zwei zutreffende Regeln
        treffen beide zu. Die Karte steht dann in beiden `columns[].todos` und
        einmal in `appearances`.

        `limit` gilt **je Spalte**. Eine Fortsetzungsmarke nimmt diese Route
        nicht entgegen — eine Marke gehört zu genau einer geordneten Liste, und
        hier sind es so viele Listen wie Spalten. Weiter blättert man je Spalte
        über `GET /pools/{poolId}/todos` mit der Marke, die dieselbe Spalte hier
        mitgegeben hat.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - name: includeCompleted
          in: query
          description: |
            Ohne Angabe bleiben erledigte Karten außen vor — dieselbe Vorgabe
            wie in Pool-Ansichten (E-039). Sie sind trotzdem Mitglied ihrer
            Spalte; hebt ein Timerstart „Erledigt" auf, stehen sie ohne Zutun
            wieder da (A-2.5).
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Das Board zum Zeitpunkt `generatedAt`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Board' }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }

