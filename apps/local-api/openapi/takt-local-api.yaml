openapi: 3.1.0

info:
  title: Takt — lokaler Dienst
  version: 1.0.0-entwurf
  summary: HTTP-Schnittstelle des Node-Sidecars für Oberfläche und Outlook-Add-in.
  description: |
    Ressourcenschnitt aus T-001, Zugriffsverfahren aus T-011, Anwendungsfälle
    und Verdrahtung aus T-021. Diese Beschreibung ist die Prüfgrundlage für den
    Security-Checker.

    **Stand T-021:** Alle hier beschriebenen Routen sind umgesetzt und hängen
    hinter der Prüfkette. Dazu gekommen sind zwei Gruppen, die T-001 noch nicht
    kannte: die globale Suche (`/search`, E-038) und die schmale Fläche des
    Outlook-Add-ins (`/addin/*`, T-019). Der Aufgabenbereich des Add-ins wird
    auf einem **zweiten Port** über HTTPS ausgeliefert (E-046); dieser Port
    liefert ausschließlich statische Dateien und ist nicht Teil dieser
    Beschreibung.

    ## Betriebsform

    Der Dienst läuft als Node-Sidecar unter der Tauri-Hülle (E-004) und lauscht
    ausschließlich auf `127.0.0.1`. Es gibt keine Cloudanbindung, keinen
    Datenbankserver und keine Telemetrie (E-001).

    Der Port ist **fest vorgegeben** (17843) und ausdrücklich **kein
    Geheimnis** (B-1.5). Ein zufälliger Port wäre keine Sicherheitsmaßnahme:
    Eine Webseite klopft einige tausend Loopback-Ports in Sekunden ab, und ein
    lokaler Prozess sieht die offenen Ports ohnehin. Ist der Port belegt,
    startet Takt **nicht** und weicht nicht aus — sonst könnte ein fremder
    Prozess ihn zuerst belegen und sich gegenüber dem Add-in als Takt ausgeben,
    um Tokens einzusammeln.

    ## Vertrauensgrenze — zwei Maßnahmen gegen zwei verschiedene Angreifer

    Ein Dienst auf `127.0.0.1` nimmt Anfragen von jedem Prozess auf demselben
    Rechner an, einschließlich beliebiger Webseiten im Browser des Benutzers
    (R-02). Er hält Kundendaten.

    **Der Nachweis** über die Kopfzeile `X-Takt-Token` wirkt gegen einen
    beliebigen lokalen Prozess. Er ist dort die einzige Maßnahme, die überhaupt
    wirkt.

    **Die Herkunftsprüfung** (`Host`, `Origin`, `Sec-Fetch-*`) wirkt gegen eine
    fremde Webseite im Browser des Benutzers, weil ein Browser sie zu
    wahrheitsgemäßen Werten zwingt. Gegen einen lokalen Prozess ist sie
    **wirkungslos** — drei Zeilen Skript setzen diese Kopfzeilen frei. Sie ist
    also **keine zweite Schicht hinter dem Token**, sondern eine eigenständige
    Maßnahme gegen einen anderen Akteur (B-2.9). Keine ersetzt die andere.

    Daraus folgt im Einzelnen:

    * **Jede** Route verlangt den Nachweis. Es gibt keine offene Route, auch
      keine Zustandsabfrage — eine unauthentifizierte Antwort würde jedem
      lokalen Prozess verraten, dass Takt läuft.
    * Der `Host`-Kopf muss buchstäblich `127.0.0.1:<port>` oder
      `localhost:<port>` sein. Das schließt DNS-Rebinding aus. Die Prüfung
      steht **vor** dem Nachweis, damit ein Angreifer am Token nicht einmal
      einen Zeitunterschied beobachten kann.
    * Eine vorhandene, aber nicht gelistete `Origin` wird **abgewiesen**, nicht
      nur ohne CORS-Kopfzeilen beantwortet.
    * Zustandsändernde Routen nehmen ausschließlich `application/json` an und
      antworten sonst mit 415, bevor der Rumpf gelesen wird.
    * **Keine Cookies, keine Sitzung, kein `Authorization`-Kopf.** Der Nachweis
      steht in einer eigenen Kopfzeile. Damit gibt es keine Berechtigung, die
      ein Browser von sich aus mitschickt, und CSRF verliert seine Grundlage.
      `Access-Control-Allow-Credentials` bleibt aus.
    * Das Token steht nie in der Adresse. Eine Anfrage, die eines mitführt,
      wird mit 400 abgewiesen; das Token gilt danach als kompromittiert.

    ## Zwei Sorten Nachweis

    | Sorte | Herkunft | Lebensdauer | Wozu |
    |---|---|---|---|
    | Sitzungsgeheimnis | von der Tauri-Hülle über `stdin` an den Sidecar | je Start | die Oberfläche |
    | Add-in-Token | in der Anwendung erzeugt, vom Benutzer in Outlook eingetragen | bis zur Neuerzeugung | das Outlook-Add-in |

    Beide gehen durch dieselbe Kopfzeile und denselben zeitkonstanten
    Vergleich. Die Oberfläche benutzt das Add-in-Token **nicht**: Damit hängt
    das dauerhafte Geheimnis allein an der Add-in-Strecke, und ein entwendetes
    Add-in-Token kann sich weder anzeigen noch selbst austauschen.

  contact:
    name: Takt, lokale Anwendung
  license:
    name: proprietär

servers:
  - url: http://127.0.0.1:{port}/api/v1
    description: Node-Sidecar, ausschließlich lokal erreichbar
    variables:
      port:
        default: '17843'
        description: |
          Fest vorgegeben und ausdrücklich kein Geheimnis (B-1.5). Ist er
          belegt, startet der Dienst nicht und weicht nicht aus.

security:
  - TaktToken: []

tags:
  - name: Zustand
    description: Erreichbarkeit des Dienstes.
  - name: Zugriff
    description: |
      Token-Verfahren und Sicherheitsmeldungen (E-009, T-011). Erreichbar
      ausschließlich mit dem Sitzungsgeheimnis der Oberfläche.
  - name: Todos
    description: Todos und Tickets (A-2.*).
  - name: Notizen
    description: Die persönliche Todo-Notiz (A-7.1, A-7.2). Getrennte Ressource, siehe R-06.
  - name: Tags
    description: Tags und Tag-Ordner (A-4.*).
  - name: Pools
    description: |
      Regeln über Tags. Regel gespeichert, Mitgliedschaft abgeleitet (A-3.4).

      Seit E-054 ist eine **Kanban-Spalte dieselbe Entität**; `placement` sagt,
      wo eine Regel erscheint. Wer eine Spalte anlegt, legt hier an.
  - name: Kanban
    description: |
      Das Board (E-054) und der Status eines Todos (A-5.4).

      Zwei verschiedene Dinge, seit E-054 auch im Modell: Die **Spalten** des
      Boards sind Regeln über Tags und stehen unter `/pools`; der **Status**
      ist eine Eigenschaft des Todos und steht unter `/todo-statuses`. Das
      Board selbst wird unter `/board` gelesen.
  - name: Zeitbuchungen
    description: Erfasste Arbeitszeit (A-6.*).
  - name: Timer
    description: Der laufende Timer. Höchstens einer (A-6.8).
  - name: Export
    description: Exportläufe, Vorlagen und Exportstatus (A-8.*, E-012).
  - name: Suche
    description: |
      Die globale Suche trifft Todos **und** Zeitbuchungen (E-038). Zwei
      Listen in einer Antwort, keine gemischte: Ein Treffer in einer Leistung
      ist etwas anderes als ein Treffer in einem Titel.
  - name: Add-in
    description: |
      Die schmale Fläche des Outlook-Add-ins (T-019, RR-1).

      Vier Routen, mehr nicht: Baum und Vorbelegungen lesen, nach einer
      Call-Nummer suchen, ein Todo anlegen, eine Zeit buchen. Kein Löschen,
      kein Export, kein Zugriff auf den internen Vermerk eines fremden Todos,
      keine Einstellungen.

      Der Grund ist nicht Sparsamkeit: Das Add-in weist sich mit dem
      **dauerhaften** Token aus, die Oberfläche mit dem Sitzungsgeheimnis
      (B-2.9 Punkt 3). Ein entwendetes Add-in-Token kommt genau so weit, wie
      diese Fläche reicht.
  - name: Einstellungen
    description: Anwendungseinstellungen, Standard-Tags (A-9, E-011).

paths:

  # ---------------------------------------------------------------------------
  /health:
    get:
      tags: [Zustand]
      operationId: health
      summary: Erreichbarkeit prüfen
      description: |
        Bewusst hinter der Token-Prüfung. Das Add-in benutzt diese Route für
        „Verbindung testen"; sie ist deshalb keine Ausnahme von der Regel,
        sondern der erste Fall, in dem das Token gebraucht wird.

        Die Antwort nennt keine Pfade, keine Bestandsgrößen, keine Fassung und
        keinen Benutzernamen — nur, dass der Dienst läuft.
      responses:
        '200':
          description: Der Dienst läuft.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, const: ok }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }

  # ---------------------------------------------------------------------------
  /token:
    get:
      tags: [Zugriff]
      operationId: getTokenStatus
      summary: Zustand des Add-in-Tokens
      description: |
        Nur mit dem **Sitzungsgeheimnis** erreichbar, also nur aus der
        Tauri-Hülle. Mit dem Add-in-Token beantwortet der Dienst diese Route mit
        401 — derselbe Text wie bei fehlendem Nachweis, damit ein Aufrufer nicht
        erfährt, dass es die Route für jemand anderen gibt.

        Es gibt **keinen** Klartext zurück. Der existiert nach der Erzeugung
        nicht mehr, auch nicht für die Oberfläche.
      responses:
        '200':
          description: Zustand des Tokens.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [configured, issuedAt, lastUsedAt, generation, unreadable]
                    properties:
                      configured:
                        type: boolean
                        description: Ist ein Add-in-Token eingerichtet?
                      issuedAt:
                        oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
                      lastUsedAt:
                        oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
                        description: |
                          Zuletzt erfolgreich verwendet. So sieht der Benutzer, ob
                          überhaupt noch jemand mit dem Token arbeitet — und ob
                          jemand damit arbeitet, von dem er nichts weiß (B-2.7).
                      generation:
                        type: integer
                        minimum: 0
                        description: Wievieltes Token seit der Einrichtung.
                      unreadable:
                        type: boolean
                        description: |
                          Die Tokendatei war vorhanden, aber nicht lesbar. Der
                          Dienst erzeugt dann **kein** neues von sich aus, weil
                          das ein eingerichtetes Add-in ohne Vorwarnung
                          aussperren würde.
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }

    post:
      tags: [Zugriff]
      operationId: rotateToken
      summary: Neues Add-in-Token erzeugen
      description: |
        Erzeugt ein neues Token. **Das alte wird sofort ungültig** (B-2.7): Es
        gibt genau einen gültigen Abdruck, keine Nachfrist und keine zweite
        Gültigkeit. Die Oberfläche sagt das vor dem Bestätigen ausdrücklich —
        das Add-in funktioniert danach erst wieder, wenn der Benutzer das neue
        Token dort eingetragen hat.

        Dies ist die **einzige** Stelle im ganzen Dienst, an der ein Token in
        einer Antwort steht. Die Stelle ist eng gefasst:

        * Nur mit dem Sitzungsgeheimnis erreichbar. Ein entwendetes Add-in-Token
          kann sich nicht selbst austauschen und den Benutzer damit nicht aus
          seinem eigenen Dienst aussperren.
        * `Cache-Control: no-store` steht auf jeder Antwort dieses Dienstes.
        * Der Wert wird nicht protokolliert. Die Protokollzeile kennt nur
          Methode, Pfad ohne Abfrageparameter, Status, Dauer und einen
          technischen Schlüssel.

        Der Klartext ist danach nicht wieder abrufbar. Wer ihn verliert, erzeugt
        ein neues.
      responses:
        '201':
          description: Erzeugt. Der Klartext steht genau in dieser einen Antwort.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [token, issuedAt, generation]
                    properties:
                      token:
                        type: string
                        pattern: '^takt_[A-Za-z0-9_-]{43}$'
                        minLength: 48
                        maxLength: 48
                        examples: ['takt_<48 Zeichen, hier bewusst kein Beispielwert>']
                      issuedAt: { $ref: '#/components/schemas/Timestamp' }
                      generation: { type: integer, minimum: 1 }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  # ---------------------------------------------------------------------------
  /security/notices:
    get:
      tags: [Zugriff]
      operationId: getSecurityNotices
      summary: Sicherheitsmeldungen
      description: |
        Zählwerte und Zeitpunkte, mehr nicht. **Kein Wert aus einer Anfrage** —
        kein geratenes Token, keine Herkunft, keine Adresse.

        Ohne diese Route erführe der Benutzer nie, dass jemand seinen lokalen
        Dienst anspricht. Sie ist der einzige Weg, auf dem ein Angriff nach
        B-1.1 überhaupt sichtbar wird.

        Alles liegt im Arbeitsspeicher und ist beim nächsten Start wieder leer.
        Eine Protokolldatei darüber wäre eine zweite Datei in der Nähe von
        Kundendaten, die niemand aufräumt (B-12.2).
      responses:
        '200':
          description: Die Meldungen seit dem Start des Dienstes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [notices]
                    properties:
                      notices:
                        type: array
                        items:
                          type: object
                          required: [kind, count, firstAt, lastAt]
                          properties:
                            kind:
                              type: string
                              enum:
                                - auth_failure_burst
                                - token_in_url
                                - origin_rejected
                                - host_rejected
                                - file_permissions_wide
                            count: { type: integer, minimum: 1 }
                            firstAt: { $ref: '#/components/schemas/Timestamp' }
                            lastAt: { $ref: '#/components/schemas/Timestamp' }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }

  # ---------------------------------------------------------------------------
  /todos:
    get:
      tags: [Todos]
      operationId: searchTodos
      summary: Todos suchen und filtern
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - name: statusId
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/Id' } }
          style: form
          explode: false
        - name: tagId
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/Id' } }
          style: form
          explode: false
        - name: poolId
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/Id' } }
          style: form
          explode: false
        - name: callNumber
          in: query
          description: Genaue Übereinstimmung. Grundlage der Duplikatprüfung im Add-in (A-10.9).
          schema: { type: string, maxLength: 128 }
        - name: onlyOpen
          in: query
          description: Nur Todos, die nicht auf „Erledigt" stehen.
          schema: { type: boolean, default: false }
        - name: onlyWithOpenEntries
          in: query
          description: Nur Todos mit mindestens einer noch nicht exportierten Buchung.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Trefferliste.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/PageInfo' }
                      - type: object
                        required: [items]
                        properties:
                          items: { type: array, items: { $ref: '#/components/schemas/Todo' } }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    post:
      tags: [Todos]
      operationId: createTodo
      summary: Todo anlegen
      description: |
        Die Standard-Tags aus A-9 werden im Dienst ergänzt, nicht vom Aufrufer
        mitgeschickt. Damit greifen sie auf jedem Weg, auch aus dem Add-in
        heraus (A-9.5).

        Auf eine bereits vergebene Call-Nummer wird nicht geprüft. A-10.9
        verlangt, dass der Benutzer entscheidet; das Add-in fragt zuvor über
        `GET /todos?callNumber=` und legt bewusst an oder bucht auf das
        vorhandene Todo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoCreate' }
      responses:
        '201':
          description: Angelegt.
          headers:
            Location:
              schema: { type: string }
              description: Adresse des neuen Todos.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TodoCreated' }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /todos/{todoId}:
    parameters: [{ $ref: '#/components/parameters/TodoId' }]
    get:
      tags: [Todos]
      operationId: getTodo
      summary: Todo lesen
      description: |
        Enthält die persönliche Notiz **nicht**. Sie wird über
        `/todos/{todoId}/note` gesondert geholt (A-7.2, R-06).

        Die Antwort ist **nicht** das Todo selbst, sondern `TodoDetail`: das
        Todo unter `todo` und daneben die beiden Summen. Bis T-041 stand hier
        `Todo`; wer dagegen baute, las `data.title` als `undefined` und bekam
        keine Fehlermeldung, sondern eine leere Anzeige. Dieselbe Schadensart
        wie C-03 und derselbe Befund, den T-022 an `GET /settings` und
        `POST /todos` von Hand gefunden hat.
      responses:
        '200':
          description: Das Todo und seine berechneten Summen.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TodoDetail' }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Todos]
      operationId: updateTodo
      summary: Todo ändern
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoUpdate' }
      responses:
        '200':
          description: Geändert.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Todo' }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Todos]
      operationId: deleteTodo
      summary: Todo löschen
      description: |
        Scheitert mit `409`, sobald am Todo eine bereits exportierte Buchung
        hängt. Abgerechnete Zeit wird nicht durch das Löschen eines Todos
        entfernt.
      responses:
        '204': { description: Gelöscht. }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /todos/{todoId}/note:
    parameters: [{ $ref: '#/components/parameters/TodoId' }]
    get:
      tags: [Notizen]
      operationId: getTodoNote
      summary: Persönliche Todo-Notiz lesen
      description: |
        Eigene Ressource, nicht ein Feld am Todo. Die Notiz ist ausschließlich
        innerhalb der Anwendung sichtbar und geht nie in den Export (A-7.2).
        Die Trennung ist im Datenmodell verankert: eigene Tabelle, nicht Teil
        der Exportsicht, nicht als Vorlagenquelle wählbar (R-06).
      responses:
        '200':
          description: Die Notiz.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TodoNote' }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Notizen]
      operationId: putTodoNote
      summary: Persönliche Todo-Notiz schreiben
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 20000 }
      responses:
        '200':
          description: Gespeichert.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TodoNote' }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /todos/{todoId}/done:
    parameters: [{ $ref: '#/components/parameters/TodoId' }]
    put:
      tags: [Todos]
      operationId: markTodoDone
      summary: Todo als erledigt markieren (A-2.4)
      responses:
        '200':
          description: Erledigt.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Todo' }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Todos]
      operationId: clearTodoDone
      summary: Erledigt-Status aufheben
      description: |
        Das Todo kehrt in die Spalte zurück, in der es vor dem Erledigen lag,
        ersatzweise in die Standardspalte. Seine Pools findet es ohne weiteres
        Zutun wieder, weil die Zugehörigkeit aus den Tags abgeleitet und nicht
        gespeichert ist (A-3.4).
      responses:
        '200':
          description: Wieder aktiv.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Todo' }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
