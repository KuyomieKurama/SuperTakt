  /todo-statuses:
    get:
      tags: [Kanban]
      operationId: listTodoStatuses
      summary: Statusspalten listen (A-5.4)
      responses:
        '200':
          description: Spalten in ihrer Reihenfolge.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TodoStatus' } }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
    post:
      tags: [Kanban]
      operationId: createTodoStatus
      summary: Statusspalte anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                color: { $ref: '#/components/schemas/Color' }
                position: { type: integer, minimum: 0, default: 0 }
      # `color` ist seit T-051 **gelesen**. Bis dahin nahm die Route es nicht
      # entgegen, während die Oberfläche es sendete: Zod streifte den Schlüssel
      # ab, die Spalte entstand farblos, und niemand bekam eine Meldung. Der
      # Fund stammt von `proof:callers`, dem Abgleich der Aufrufer gegen die
      # Routenschemata. Ohne Angabe bleibt die Spalte farblos; `PATCH` setzt die
      # Farbe weiterhin nachträglich.
      responses:
        '201':
          description: Angelegt.
          headers:
            Location:
              schema: { type: string }
              description: Adresse der neuen Spalte.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TodoStatus' }
        '400': { $ref: '#/components/responses/TokenInUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OriginRejected' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

