# Wem welcher Abschnitt gehört — und was hier wirklich nicht steht
#
# Der Namensraum /api/v1/addin/** STEHT in dieser Datei. Seit T-019 sind es vier
# Operationen — getAddinContext, findAddinDuplicates, createAddinTodo,
# createAddinTimeEntry — samt der Bauteile AddinTodoCreated und AddinTodoMatch.
#
# Bis T-062 stand hier das Gegenteil: „wird gesondert beschrieben", „Nicht in
# dieser Datei beschrieben". Der Satz stammte aus der Zeit vor T-019 und ist
# drei Aufgaben lang stehen geblieben. Schaden hat er nicht angerichtet, weil
# `proof:openapi` die Routen in beide Richtungen vergleicht und eine
# unbeschriebene Route rot färbt — aber genau deshalb war er auch nicht zu
# messen: Er ist eine Aussage ÜBER die Datei, und die führt kein Lauf aus.
# Gefunden hat ihn ein Mensch (T-061, Nebenbefund).
#
# Dateihoheit. Die vier /addin-Pfade und die beiden Add-in-Bauteile gehören zu
# `apps/local-api/src/routes/addin/` (integration-dev), alles Übrige in dieser
# Datei dem domain-dev. Eine Datei mit zwei Abschnitten und nicht zwei Dateien:
# Die Add-in-Fläche benutzt dieselbe Token-Prüfung, dasselbe Fehlerformat,
# dieselben Herkunftsprüfungen und dieselben Bauteile (Id, Timestamp, Tag,
# Problem). Zwei Dateien hätten davon irgendwann zwei Fassungen — und die
# Add-in-Fläche ist die, bei der ein Auseinanderlaufen zuletzt auffiele.
#
# Unverändert gilt für sie: Sie darf keine Route enthalten, die den internen
# Vermerk (A-7.1) an eine Exportfläche weiterreicht (A-7.2, R-06).
#
# Nicht in dieser Datei beschrieben ist der Aufgabenbereich selbst. Er wird auf
# einem zweiten Port über HTTPS ausgeliefert (E-046), besteht ausschließlich aus
# statischen Dateien und hat keine Operation — es gibt also nichts zu
# beschreiben, nicht bloß nichts Beschriebenes.
