<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Takt — Todo aus E-Mail</title>

    <!--
      Inhaltssicherheitsrichtlinie (B-10.4, B-10.6, B-12.1).

      `script-src` erlaubt genau zwei Herkünfte: das eigene Bündel und
      `appsforoffice.microsoft.com`. Letzteres ist die einzige Ausnahme von
      E-001 und von Microsoft vorgeschrieben — `office.js` muss von dort
      geladen werden, und eine Integritätsprüfung per SRI ist nicht haltbar,
      weil die Datei laufend aktualisiert wird.

      `connect-src` erlaubt ausschließlich den lokalen Dienst auf 127.0.0.1
      beziehungsweise localhost. Damit kann selbst ein eingeschleustes Skript
      die Daten nirgendwohin schicken.

      `object-src 'none'`, `base-uri 'none'` und `form-action 'none'`
      schließen die üblichen Umwege. `style-src` erlaubt `'unsafe-inline'`,
      weil Vite die Stilangaben zur Laufzeit einfügt; Stil kann in einer Seite
      ohne `script-src`-Lücke keinen Code ausführen.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'self' https://appsforoffice.microsoft.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self';
        connect-src http://127.0.0.1:17843 http://localhost:17843 https://appsforoffice.microsoft.com;
        worker-src 'self' blob:;
        object-src 'none';
        base-uri 'none';
        form-action 'none';
        frame-ancestors https://outlook.office.com https://outlook.office365.com https://outlook.live.com;
      "
    />
    <meta name="referrer" content="no-referrer" />

    <!--
      `office.js` steht vor dem Bündel und ist bewusst nicht als Modul geladen:
      Es setzt `window.Office` und muss fertig sein, bevor `Office.onReady`
      irgendwo aufgerufen wird.
    -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Für diesen Aufgabenbereich wird JavaScript benötigt. Ein Todo lässt sich auch unmittelbar in
      Takt anlegen.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
